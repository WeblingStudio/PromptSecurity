name: test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test-js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run core tests
        run: npx tsx test/test_basic.ts

      - name: Run intent tests
        run: npx tsx test/test_intent.ts

      - name: Run intent integration tests
        run: npx tsx test/test_intent_integration.ts

      - name: Run conversation tests
        run: npx tsx test/test_conversation.ts

      - name: Run performance tests
        run: npx tsx test/test_performance.ts

  test-py:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: python3 test/test_basic.py
